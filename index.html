<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MySeries - Dizi Takipçim</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Inter', sans-serif;
            background-color: #09090b; /* zinc-950 */
            color: #f4f4f5; /* zinc-50 */
        }
        /* Özel Scrollbar */
        ::-webkit-scrollbar {
            width: 8px;
            height: 8px;
        }
        ::-webkit-scrollbar-track {
            background: #18181b; 
        }
        ::-webkit-scrollbar-thumb {
            background: #3f3f46; 
            border-radius: 4px;
        }
        ::-webkit-scrollbar-thumb:hover {
            background: #52525b; 
        }
        .hide-scrollbar::-webkit-scrollbar {
            display: none;
        }
        .hide-scrollbar {
            -ms-overflow-style: none;
            scrollbar-width: none;
        }
        
        /* Arama Yükleniyor Animasyonu */
        .loader {
            border: 2px solid #27272a;
            border-bottom-color: #22c55e;
            border-radius: 50%;
            display: inline-block;
            box-sizing: border-box;
            animation: rotation 1s linear infinite;
        }
        @keyframes rotation {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        /* Checkbox Stili */
        .ep-checkbox {
            appearance: none;
            width: 1.25rem;
            height: 1.25rem;
            border: 2px solid #52525b;
            border-radius: 0.25rem;
            outline: none;
            cursor: pointer;
            position: relative;
            transition: all 0.2s;
        }
        .ep-checkbox:checked {
            background-color: #22c55e;
            border-color: #22c55e;
        }
        .ep-checkbox:checked::after {
            content: '\f00c';
            font-family: 'Font Awesome 6 Free';
            font-weight: 900;
            color: white;
            position: absolute;
            font-size: 0.75rem;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
        }
        .ep-checkbox:disabled {
            border-color: #27272a;
            background-color: #18181b;
            cursor: not-allowed;
            opacity: 0.5;
        }
        
        /* Yıldız Skalası (Slider) Animasyonu */
        .star-rating-container:hover .star-slider-wrapper {
            display: flex;
            opacity: 1;
        }
        
        /* Range Slider Stili */
        input[type=range] {
            -webkit-appearance: none;
            background: transparent;
        }
        input[type=range]::-webkit-slider-thumb {
            -webkit-appearance: none;
            height: 16px;
            width: 16px;
            border-radius: 50%;
            background: #eab308;
            cursor: pointer;
            margin-top: -6px;
        }
        input[type=range]::-webkit-slider-runnable-track {
            width: 100%;
            height: 4px;
            cursor: pointer;
            background: #3f3f46;
            border-radius: 2px;
        }
    </style>
</head>
<body class="min-h-screen pb-20 relative">

    <header class="bg-zinc-900 border-b border-zinc-800 sticky top-0 z-40 shadow-md">
        <div class="container mx-auto px-4 py-4 flex flex-col items-center gap-4">
            <!-- Merkeze Alınmış Logo ve Başlık -->
            <div class="flex items-center gap-3 mb-2">
                <div class="bg-green-500 w-12 h-12 rounded-xl flex items-center justify-center text-zinc-950 font-bold text-2xl shadow-lg shadow-green-500/20">
                    <i class="fa-solid fa-play"></i>
                </div>
                <h1 class="text-3xl font-bold tracking-tight text-white">My<span class="text-green-500">Series</span></h1>
            </div>

            <!-- İstatistikler -->
            <div class="flex gap-4 text-sm overflow-x-auto w-full md:w-auto pb-2 md:pb-0 hide-scrollbar justify-center">
                <div class="bg-zinc-950 border border-zinc-800 rounded-lg px-4 py-2 flex items-center gap-3 min-w-max">
                    <i class="fa-solid fa-list-ul text-zinc-500"></i>
                    <div>
                        <p class="text-zinc-400 text-xs">Toplam Dizi</p>
                        <p class="font-bold text-white" id="stat-total">0</p>
                    </div>
                </div>
                <div class="bg-zinc-950 border border-zinc-800 rounded-lg px-4 py-2 flex items-center gap-3 min-w-max">
                    <i class="fa-solid fa-tv text-zinc-500"></i>
                    <div>
                        <p class="text-zinc-400 text-xs">İzleniyor</p>
                        <p class="font-bold text-white" id="stat-watching">0</p>
                    </div>
                </div>
                <div class="bg-zinc-950 border border-zinc-800 rounded-lg px-4 py-2 flex items-center gap-3 min-w-max">
                    <i class="fa-solid fa-check-double text-green-500"></i>
                    <div>
                        <p class="text-zinc-400 text-xs">Bitenler</p>
                        <p class="font-bold text-green-500" id="stat-completed">0</p>
                    </div>
                </div>
                <div class="bg-zinc-950 border border-zinc-800 rounded-lg px-4 py-2 flex items-center gap-3 min-w-max">
                    <i class="fa-solid fa-film text-purple-500"></i>
                    <div>
                        <p class="text-zinc-400 text-xs">İzlenen Bölüm</p>
                        <p class="font-bold text-purple-500" id="stat-episodes">0</p>
                    </div>
                </div>
            </div>
            
            <!-- Merkez Dizi Ekleme Butonu -->
            <div class="mt-2">
                <button onclick="openModal('add')" class="bg-green-600 hover:bg-green-500 text-white px-8 py-2.5 rounded-full font-semibold transition-all shadow-lg shadow-green-600/30 flex items-center gap-2 hover:-translate-y-0.5 border border-green-500">
                    <i class="fa-solid fa-plus"></i> Yeni Dizi Ekle
                </button>
            </div>
        </div>
    </header>

    <main class="container mx-auto px-4 py-8">
        
        <!-- Filtreleme ve Sıralama -->
        <div class="flex flex-col md:flex-row justify-between items-start md:items-center gap-4 mb-8">
            <div class="flex gap-2 bg-zinc-900 p-1 rounded-xl w-full md:w-auto border border-zinc-800 overflow-x-auto hide-scrollbar">
                <button onclick="setFilter('all')" id="btn-all" class="flex-1 md:flex-none px-4 py-2 rounded-lg text-sm font-medium transition-colors bg-green-500/10 text-green-500 whitespace-nowrap">Tümü</button>
                <button onclick="setFilter('watching')" id="btn-watching" class="flex-1 md:flex-none px-4 py-2 rounded-lg text-sm font-medium transition-colors text-zinc-400 hover:text-white hover:bg-zinc-800 whitespace-nowrap">İzleniyor</button>
                <button onclick="setFilter('plan_to_watch')" id="btn-plan_to_watch" class="flex-1 md:flex-none px-4 py-2 rounded-lg text-sm font-medium transition-colors text-zinc-400 hover:text-white hover:bg-zinc-800 whitespace-nowrap">İzlenecekler</button>
                <button onclick="setFilter('completed')" id="btn-completed" class="flex-1 md:flex-none px-4 py-2 rounded-lg text-sm font-medium transition-colors text-zinc-400 hover:text-white hover:bg-zinc-800 whitespace-nowrap">Bitenler</button>
                <button onclick="setFilter('favorites')" id="btn-favorites" class="flex-1 md:flex-none px-4 py-2 rounded-lg text-sm font-medium transition-colors text-zinc-400 hover:text-white hover:bg-zinc-800 whitespace-nowrap"><i class="fa-solid fa-heart mr-1"></i> Favoriler</button>
            </div>
            
            <div class="flex items-center gap-2 bg-zinc-900 border border-zinc-800 rounded-xl px-3 py-1.5 w-full md:w-auto shrink-0">
                <i class="fa-solid fa-arrow-down-a-z text-zinc-500"></i>
                <select id="sort-select" onchange="renderSeries()" class="bg-transparent text-sm text-zinc-200 outline-none focus:ring-0 py-1 cursor-pointer w-full">
                    <option value="newest" class="bg-zinc-900">En Yeni Eklenen</option>
                    <option value="oldest" class="bg-zinc-900">En Eski Eklenen</option>
                    <option value="rating_high" class="bg-zinc-900">Puan (En Yüksek)</option>
                    <option value="rating_low" class="bg-zinc-900">Puan (En Düşük)</option>
                </select>
            </div>
        </div>

        <!-- Dizilerin/Bölümlerin Listeleneceği Alan -->
        <div id="series-grid" class="grid grid-cols-2 md:grid-cols-4 lg:grid-cols-6 gap-4 md:gap-5">
            <!-- JavaScript ile doldurulacak -->
        </div>

        <div id="empty-state" class="hidden text-center py-20 flex flex-col items-center">
            <div class="w-24 h-24 bg-zinc-900 rounded-full flex items-center justify-center mb-4 text-zinc-700 text-4xl border border-zinc-800">
                <i class="fa-solid fa-ghost"></i>
            </div>
            <h2 id="empty-state-title" class="text-xl font-bold text-zinc-300 mb-2">Buralar çok ıssız</h2>
            <p id="empty-state-desc" class="text-zinc-500 mb-6 max-w-md">Henüz bu kategoride hiç dizin yok. Hemen yeni bir dizi aratarak takip etmeye başla.</p>
        </div>

    </main>

    <div id="form-modal" class="fixed inset-0 bg-black/80 backdrop-blur-sm hidden items-center justify-center z-50 p-4 opacity-0 transition-opacity duration-300">
        <div class="bg-zinc-900 rounded-2xl w-full max-w-md overflow-hidden shadow-2xl border border-zinc-800 transform scale-95 transition-transform duration-300" id="form-modal-content">
            <div class="p-6 border-b border-zinc-800 flex justify-between items-center">
                <h2 id="modal-title" class="text-xl font-bold text-white">Dizi Ekle</h2>
                <button onclick="closeModal()" class="text-zinc-500 hover:text-white transition-colors w-8 h-8 flex items-center justify-center rounded-full hover:bg-zinc-800">
                    <i class="fa-solid fa-xmark"></i>
                </button>
            </div>
            
            <div class="p-6 space-y-5">
                <input type="hidden" id="edit-id">
                
                <div>
                    <label class="block text-sm font-medium text-zinc-300 mb-1">Dizi Ara</label>
                    <div class="relative w-full">
                        <input type="text" id="series-search" oninput="searchTVMaze()" placeholder="Dizi adını yazmaya başla..." 
                            class="w-full bg-zinc-950 border border-zinc-700 rounded-xl px-4 py-3 text-white placeholder-zinc-600 focus:outline-none focus:border-green-500 focus:ring-1 focus:ring-green-500">
                        <div id="search-loader" class="absolute right-4 top-3.5 hidden">
                            <div class="loader w-5 h-5"></div>
                        </div>
                        <!-- Arama Sonuçları: Yatay genişliği kontrol altında -->
                        <div id="search-results" class="hidden absolute z-10 w-full mt-1 bg-zinc-800 border border-zinc-700 rounded-xl shadow-lg max-h-60 overflow-y-auto">
                            <!-- Sonuçlar buraya gelecek -->
                        </div>
                    </div>
                </div>

                <div class="flex gap-4">
                    <!-- Seçilen Poster Gösterimi -->
                    <div id="selected-poster-container" class="hidden w-24 h-36 rounded-lg overflow-hidden border border-zinc-700 shrink-0">
                        <img id="selected-poster" src="" alt="Poster" class="w-full h-full object-cover">
                    </div>
                    
                    <div class="flex-1 space-y-4">
                        <input type="hidden" id="series-name">
                        <input type="hidden" id="series-poster">
                        <input type="hidden" id="series-tvmaze-id">

                        <div>
                            <label class="block text-sm font-medium text-zinc-300 mb-1">Durum</label>
                            <select id="series-status" class="w-full bg-zinc-950 border border-zinc-700 rounded-xl px-4 py-3 text-white focus:outline-none focus:border-green-500 focus:ring-1 focus:ring-green-500 appearance-none">
                                <option value="watching">İzleniyor</option>
                                <option value="plan_to_watch">İzlenecekler</option>
                                <option value="completed">Bitti</option>
                            </select>
                        </div>

                        <div>
                            <label class="block text-sm font-medium text-zinc-300 mb-1 flex justify-between">
                                <span>Puanınız</span>
                                <span id="rating-display" class="text-yellow-500 font-bold">10.0 <i class="fa-solid fa-star text-xs"></i></span>
                            </label>
                            <!-- 10 Üzerinden Puanlama -->
                            <input type="range" id="series-rating" min="0" max="10" step="0.5" value="10" class="w-full mt-2" oninput="document.getElementById('rating-display').innerHTML = this.value + ' <i class=\'fa-solid fa-star text-xs\'></i>'">
                        </div>
                    </div>
                </div>

            </div>
            
            <div class="p-6 bg-zinc-950/50 border-t border-zinc-800 flex justify-end gap-3">
                <button onclick="closeModal()" class="px-5 py-2.5 rounded-xl font-medium text-zinc-400 hover:text-white hover:bg-zinc-800 transition-colors">İptal</button>
                <button onclick="saveSeries()" class="px-5 py-2.5 bg-green-600 hover:bg-green-500 text-white rounded-xl font-medium transition-colors shadow-lg shadow-green-600/20 border border-green-500">Kaydet</button>
            </div>
        </div>
    </div>

    <div id="episodes-modal" class="fixed inset-0 bg-black/80 backdrop-blur-sm hidden items-center justify-center z-50 p-0 md:p-4 opacity-0 transition-opacity duration-300">
        <div class="bg-zinc-900 w-full h-full md:h-[85vh] md:max-w-3xl md:rounded-2xl flex flex-col shadow-2xl border-0 md:border border-zinc-800 transform scale-95 transition-transform duration-300" id="episodes-modal-content">
            
            <div class="relative h-48 md:h-64 shrink-0 bg-zinc-950">
                <img id="ep-modal-bg" src="" class="w-full h-full object-cover opacity-40">
                <div class="absolute inset-0 bg-gradient-to-t from-zinc-900 to-transparent"></div>
                <button onclick="closeEpisodesModal()" class="absolute top-4 right-4 bg-black/50 text-white hover:bg-zinc-800 transition-colors w-10 h-10 flex items-center justify-center rounded-full backdrop-blur-md z-10 border border-zinc-700">
                    <i class="fa-solid fa-xmark"></i>
                </button>
                
                <div class="absolute bottom-0 left-0 p-6 flex items-end gap-6 w-full">
                    <div id="ep-modal-poster-container" class="w-24 md:w-32 rounded-lg overflow-hidden shadow-2xl border-2 border-zinc-800 hidden md:block shrink-0">
                        <img id="ep-modal-poster" src="" class="w-full h-auto object-cover">
                    </div>
                    <div class="flex-1 pb-2">
                        <h2 id="ep-modal-title" class="text-2xl md:text-4xl font-bold text-white mb-2 leading-tight">Dizi Adı</h2>
                        <div class="flex items-center gap-4 text-sm">
                            <span id="ep-modal-progress-text" class="text-zinc-400">0 / 0 Bölüm İzlendi</span>
                            <div class="w-32 h-2 bg-zinc-800 rounded-full overflow-hidden">
                                <div id="ep-modal-progress-bar" class="h-full bg-green-500 rounded-full transition-all duration-500" style="width: 0%"></div>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
            
            <div class="flex-1 overflow-y-auto p-4 md:p-6 space-y-4" id="seasons-container">
                <!-- Sezonlar JS ile buraya yüklenecek -->
                <div class="flex justify-center py-10">
                    <div class="loader w-8 h-8"></div>
                </div>
            </div>
        </div>
    </div>

    <script>
        // Veritabanı State
        let seriesList = JSON.parse(localStorage.getItem('mySeriesData')) || [];
        let currentFilter = 'all';
        let searchTimeout = null;

        document.addEventListener('DOMContentLoaded', () => {
            renderSeries();
            updateStats();
        });

        function saveToStorage() {
            localStorage.setItem('mySeriesData', JSON.stringify(seriesList));
            updateStats();
        }

        function setFilter(filter) {
            currentFilter = filter;
            // Buton stillerini güncelle
            ['all', 'watching', 'plan_to_watch', 'completed', 'favorites'].forEach(f => {
                const btn = document.getElementById(`btn-${f}`);
                if (btn) {
                    if(f === filter) {
                        btn.classList.remove('text-zinc-400', 'hover:text-white', 'hover:bg-zinc-800');
                        btn.classList.add('bg-green-500/10', 'text-green-500');
                    } else {
                        btn.classList.add('text-zinc-400', 'hover:text-white', 'hover:bg-zinc-800');
                        btn.classList.remove('bg-green-500/10', 'text-green-500');
                    }
                }
            });
            renderSeries();
        }

        // Sıralama fonksiyonu
        function sortSeriesArray(array) {
            const sortBy = document.getElementById('sort-select').value;
            
            return array.sort((a, b) => {
                if (sortBy === 'newest') return (b.dateAdded || 0) - (a.dateAdded || 0);
                if (sortBy === 'oldest') return (a.dateAdded || 0) - (b.dateAdded || 0);
                if (sortBy === 'rating_high') return (b.rating || 0) - (a.rating || 0);
                if (sortBy === 'rating_low') return (a.rating || 0) - (b.rating || 0);
                return 0;
            });
        }

        function renderSeries() {
            const grid = document.getElementById('series-grid');
            const emptyState = document.getElementById('empty-state');
            const emptyTitle = document.getElementById('empty-state-title');
            const emptyDesc = document.getElementById('empty-state-desc');
            grid.innerHTML = '';

            // Favoriler Filtresi Aktifse Özel Render Yap
            if (currentFilter === 'favorites') {
                let favEpisodes = [];
                seriesList.forEach((series, seriesIndex) => {
                    if (series.episodes) {
                        series.episodes.forEach(ep => {
                            if (ep.favorite) {
                                favEpisodes.push({ series, ep, seriesIndex });
                            }
                        });
                    }
                });

                if (favEpisodes.length === 0) {
                    emptyTitle.innerText = 'Favori bölümün yok';
                    emptyDesc.innerText = 'Dizilerin bölümlerini incelerken kalp ikonuna tıklayarak sevdiğin bölümleri favorilerine ekleyebilirsin.';
                    emptyState.classList.remove('hidden');
                } else {
                    emptyState.classList.add('hidden');
                    
                    // Favori bölümleri puana göre sırala (yüksekten düşüğe)
                    favEpisodes.sort((a, b) => (b.ep.rating || 0) - (a.ep.rating || 0));

                    favEpisodes.forEach(item => {
                        const ep = item.ep;
                        const series = item.series;
                        const epRating = ep.rating || 0;
                        
                        const card = document.createElement('div');
                        card.className = 'bg-zinc-900 rounded-xl overflow-hidden border border-zinc-800 transition-all hover:border-zinc-700 hover:shadow-xl hover:shadow-zinc-900/50 flex flex-col group relative';
                        
                        // Favori Bölüm Özel Rozetler
                        const ratingHtml = epRating > 0 ? 
                            `<div class="absolute top-2 right-2 bg-zinc-950/80 backdrop-blur-md text-yellow-500 text-xs font-bold px-2 py-1 rounded shadow-lg border border-zinc-700 z-10 flex items-center gap-1">
                                <i class="fa-solid fa-star"></i> ${epRating}
                            </div>` : '';

                        card.innerHTML = `
                            <div class="relative aspect-[2/3] w-full bg-zinc-950">
                                ${ratingHtml}
                                <div class="absolute top-2 left-2 bg-zinc-950/80 backdrop-blur-md text-red-500 text-xs font-bold w-8 h-8 flex items-center justify-center rounded-full shadow-lg border border-zinc-700 z-10">
                                    <i class="fa-solid fa-heart"></i>
                                </div>
                                ${series.poster ? 
                                    `<img src="${series.poster}" alt="${series.name}" class="w-full h-full object-cover opacity-70 group-hover:opacity-40 transition-opacity">` : 
                                    `<div class="w-full h-full flex flex-col items-center justify-center text-zinc-700">
                                        <i class="fa-solid fa-image text-3xl mb-2"></i>
                                    </div>`
                                }
                                
                                <div class="absolute inset-0 flex flex-col items-center justify-center opacity-0 group-hover:opacity-100 transition-opacity z-20 p-4">
                                    <button onclick="openEpisodesModal(${item.seriesIndex})" class="w-full bg-green-600 hover:bg-green-500 text-white font-medium py-2 rounded-lg text-sm transition-colors shadow-lg border border-green-500">
                                        <i class="fa-solid fa-list-check mr-1"></i> Diziyi Gör
                                    </button>
                                </div>
                            </div>
                            
                            <div class="p-3 flex-1 flex flex-col justify-center">
                                <p class="text-xs text-green-500 font-bold mb-1 truncate" title="${series.name}">${series.name}</p>
                                <h3 class="font-bold text-white text-sm line-clamp-2" title="${ep.name}">${ep.season}. Sezon ${ep.number}. Bölüm<br><span class="text-zinc-400 font-normal mt-0.5 inline-block line-clamp-1">${ep.name || ''}</span></h3>
                            </div>
                        `;
                        grid.appendChild(card);
                    });
                }
                return; // Favoriler ekranı çizildi, normal dizileri çizme.
            }

            // Normal Dizi Render İşlemleri
            emptyTitle.innerText = 'Buralar çok ıssız';
            emptyDesc.innerText = 'Henüz bu kategoride hiç dizin yok. Hemen yeni bir dizi aratarak takip etmeye başla.';

            let filteredList = currentFilter === 'all' 
                ? [...seriesList] 
                : seriesList.filter(s => s.status === currentFilter);

            filteredList = sortSeriesArray(filteredList);

            if (filteredList.length === 0) {
                emptyState.classList.remove('hidden');
            } else {
                emptyState.classList.add('hidden');
                
                filteredList.forEach((series) => {
                    const originalIndex = seriesList.findIndex(s => s.id === series.id);
                    
                    let totalWatched = 0;
                    let totalEpisodes = 0;
                    let nextEp = null;
                    const now = new Date();

                    if (series.episodes && series.episodes.length > 0) {
                        totalEpisodes = series.episodes.length;
                        totalWatched = series.episodes.filter(ep => ep.watched).length;
                        
                        const futureEps = series.episodes.filter(ep => {
                            if (!ep.airstamp) return false;
                            const airDate = new Date(ep.airstamp);
                            return airDate > now;
                        }).sort((a, b) => new Date(a.airstamp) - new Date(b.airstamp));

                        if (futureEps.length > 0) {
                            nextEp = futureEps[0];
                            const diffTime = Math.abs(new Date(nextEp.airstamp) - now);
                            const diffDays = Math.ceil(diffTime / (1000 * 60 * 60 * 24));
                            nextEp.daysLeft = diffDays;
                        }
                    } else {
                        totalWatched = series.watchedEpisodes || 0;
                        totalEpisodes = series.totalEpisodes || 0;
                    }

                    const progressPercent = totalEpisodes > 0 ? (totalWatched / totalEpisodes) * 100 : 0;
                    
                    let statusBadge = '';
                    if(series.status === 'watching') statusBadge = '<span class="bg-blue-900/50 text-blue-400 text-[10px] font-bold px-2 py-0.5 rounded-full border border-blue-800">İzleniyor</span>';
                    else if(series.status === 'completed') statusBadge = '<span class="bg-green-900/50 text-green-400 text-[10px] font-bold px-2 py-0.5 rounded-full border border-green-800">Bitti</span>';
                    else statusBadge = '<span class="bg-zinc-800 text-zinc-400 text-[10px] font-bold px-2 py-0.5 rounded-full border border-zinc-700">İzlenecek</span>';

                    let nextEpBadge = '';
                    if (nextEp && series.status !== 'completed') {
                        let text = nextEp.daysLeft === 0 ? 'Bugün Yeni Bölüm!' : `${nextEp.daysLeft} gün sonra`;
                        // Yeni bölüm uyarısı sol üst köşe
                        nextEpBadge = `<div class="absolute top-2 left-2 bg-blue-600/90 backdrop-blur-sm text-white text-[10px] font-bold px-2 py-1 rounded shadow-lg z-10 animate-pulse border border-blue-400">
                            ${text}
                        </div>`;
                    }

                        <div class="relative aspect-[2/3] w-full bg-zinc-950">

                            ${ratingHtml}

                                    <i class="fa-solid fa-list-check mr-1"></i> Bölümler
                                </button>
                                <button onclick="editSeries(${originalIndex})" class="w-full bg-zinc-800 hover:bg-zinc-700 text-white font-medium py-2 rounded-lg text-sm transition-colors border border-zinc-700">
                                    <i class="fa-solid fa-pen mr-1"></i> Düzenle
                                </button>
                                <button onclick="deleteSeries(${originalIndex})" class="w-full bg-red-900/50 hover:bg-red-600 text-red-200 hover:text-white font-medium py-2 rounded-lg text-sm transition-colors border border-red-900">
                                    <i class="fa-solid fa-trash mr-1"></i> Sil
                                </button>
                            </div>
                        </div>
                        
                        <div class="p-3 flex-1 flex flex-col">
                            <h3 class="font-bold text-white text-sm line-clamp-1 mb-1" title="${series.name}">${series.name}</h3>
                            <div class="flex items-center justify-between mt-auto">
                                ${statusBadge}
                                <span class="text-xs font-medium text-zinc-400 bg-zinc-950 px-2 py-0.5 rounded-full border border-zinc-800">
                                    ${totalWatched}/${totalEpisodes}
                                </span>
                            </div>
                            
                            <div class="w-full h-1.5 bg-zinc-950 rounded-full mt-3 overflow-hidden border border-zinc-800">

        function updateStats() {
            document.getElementById('stat-total').innerText = seriesList.length;
            document.getElementById('stat-watching').innerText = seriesList.filter(s => s.status === 'watching').length;
            document.getElementById('stat-completed').innerText = seriesList.filter(s => s.status === 'completed').length;
            
            let totalEpWatched = 0;
            seriesList.forEach(s => {
                if(s.episodes) {
                    totalEpWatched += s.episodes.filter(ep => ep.watched).length;
                } else {
                    totalEpWatched += parseInt(s.watchedEpisodes || 0);
                }
            });
            document.getElementById('stat-episodes').innerText = totalEpWatched;
        }

        function searchTVMaze() {
            const query = document.getElementById('series-search').value.trim();
            const resultsContainer = document.getElementById('search-results');
            const loader = document.getElementById('search-loader');

            clearTimeout(searchTimeout);

            if (query.length < 2) {
                resultsContainer.classList.add('hidden');
                loader.classList.add('hidden');
                return;
            }

            loader.classList.remove('hidden');

            searchTimeout = setTimeout(async () => {
                try {
                    const response = await fetch(`https://api.tvmaze.com/search/shows?q=${encodeURIComponent(query)}`);
                    const data = await response.json();
                    
                    resultsContainer.innerHTML = '';
                    
                    if (data.length === 0) {
                        resultsContainer.innerHTML = '<div class="p-4 text-zinc-400 text-sm text-center">Sonuç bulunamadı</div>';
                    } else {
                        data.forEach(item => {
                            const show = item.show;
                            const posterUrl = show.image ? show.image.medium : '';
                            const year = show.premiered ? show.premiered.substring(0,4) : 'Bilinmiyor';
                            
                            const div = document.createElement('div');
                            div.className = 'p-3 hover:bg-zinc-700 cursor-pointer flex items-center gap-3 border-b border-zinc-700 last:border-0 transition-colors';
                            div.onclick = () => selectSeries(show);
                            
                            div.innerHTML = `
                                ${posterUrl ? `<img src="${posterUrl}" class="w-10 h-14 object-cover rounded border border-zinc-600">` : `<div class="w-10 h-14 bg-zinc-800 rounded border border-zinc-700 flex items-center justify-center text-zinc-500 text-xs">Görsel</div>`}
                                <div>
                                    <div class="font-medium text-white">${show.name}</div>
                                    <div class="text-xs text-zinc-400">${year} • ${show.network ? show.network.name : (show.webChannel ? show.webChannel.name : 'Platform Yok')}</div>
                                </div>
                            `;
                            resultsContainer.appendChild(div);
                        });
                    }
                    resultsContainer.classList.remove('hidden');
                } catch (error) {
                    console.error("Arama hatası:", error);
                } finally {
                    loader.classList.add('hidden');
                }
            }, 500);
        }

        function selectSeries(show) {
            document.getElementById('series-search').value = show.name;
            document.getElementById('series-name').value = show.name;
            document.getElementById('series-tvmaze-id').value = show.id;
            
            const posterUrl = show.image ? show.image.original || show.image.medium : '';
            document.getElementById('series-poster').value = posterUrl;
            
            const posterContainer = document.getElementById('selected-poster-container');
            const posterImg = document.getElementById('selected-poster');
            
            if (posterUrl) {
                posterImg.src = posterUrl;
                posterContainer.classList.remove('hidden');
            } else {
                posterContainer.classList.add('hidden');
            }

            document.getElementById('search-results').classList.add('hidden');
        }

        async function fetchAndStoreEpisodes(tvmazeId, existingEpisodes = []) {
            try {
                const response = await fetch(`https://api.tvmaze.com/shows/${tvmazeId}/episodes`);
                const data = await response.json();
                
                return data.map(ep => {
                    const existingEp = existingEpisodes.find(e => String(e.id) === String(ep.id));
                    return {
                        id: ep.id,
                        name: ep.name,
                        season: ep.season,
                        number: ep.number,
                        airstamp: ep.airstamp,
                        watched: existingEp ? existingEp.watched : false,
                        favorite: existingEp ? existingEp.favorite : false,
                        rating: existingEp ? existingEp.rating : 0
                    };
                });
            } catch (error) {
                console.error("Bölüm çekme hatası:", error);
                return existingEpisodes;
            }
        }

        function openModal(mode, index = null) {
            const modal = document.getElementById('form-modal');
            const content = document.getElementById('form-modal-content');
            
            document.getElementById('edit-id').value = '';
            document.getElementById('series-search').value = '';
            document.getElementById('series-name').value = '';
            document.getElementById('series-poster').value = '';
            document.getElementById('series-tvmaze-id').value = '';
            document.getElementById('series-status').value = 'watching';
            document.getElementById('series-rating').value = 10;
            document.getElementById('rating-display').innerHTML = '10.0 <i class="fa-solid fa-star text-xs"></i>';
            document.getElementById('selected-poster-container').classList.add('hidden');
            document.getElementById('search-results').classList.add('hidden');
            
            if (mode === 'edit' && index !== null) {
                document.getElementById('modal-title').innerText = 'Diziyi Düzenle';
                const series = seriesList[index];
                
                document.getElementById('edit-id').value = series.id;
                document.getElementById('series-search').value = series.name;
                document.getElementById('series-name').value = series.name;
                document.getElementById('series-poster').value = series.poster;
                document.getElementById('series-tvmaze-id').value = series.tvmazeId || '';
                document.getElementById('series-status').value = series.status;
                
                const rating = series.rating || 0;
                document.getElementById('series-rating').value = rating;
                document.getElementById('rating-display').innerHTML = rating + ' <i class="fa-solid fa-star text-xs"></i>';

                if (series.poster) {
                    document.getElementById('selected-poster').src = series.poster;
                    document.getElementById('selected-poster-container').classList.remove('hidden');
                }
            } else {
                document.getElementById('modal-title').innerText = 'Yeni Dizi Ekle';
            }

            modal.classList.remove('hidden');
            modal.classList.add('flex');
            setTimeout(() => {
                modal.classList.remove('opacity-0');
                content.classList.remove('scale-95');
                content.classList.add('scale-100');
            }, 10);
        }

        function closeModal() {
            const modal = document.getElementById('form-modal');
            const content = document.getElementById('form-modal-content');
            
            modal.classList.add('opacity-0');
            content.classList.remove('scale-100');
            content.classList.add('scale-95');
            setTimeout(() => {
                modal.classList.add('hidden');
                modal.classList.remove('flex');
            }, 300);
        }

        async function saveSeries() {
            const editId = document.getElementById('edit-id').value;
            const name = document.getElementById('series-name').value || document.getElementById('series-search').value;
            
            if (!name.trim()) {
                alert("Lütfen bir dizi adı girin veya listeden seçin.");
                return;
            }

            const poster = document.getElementById('series-poster').value;
            const status = document.getElementById('series-status').value;
            const tvmazeId = document.getElementById('series-tvmaze-id').value;
            const rating = parseFloat(document.getElementById('series-rating').value);
            
            const saveBtn = document.querySelector('#form-modal button.bg-green-600');
            const originalBtnText = saveBtn.innerHTML;
            saveBtn.innerHTML = '<div class="loader w-5 h-5 mx-2"></div>';
            saveBtn.disabled = true;

            try {
                if (editId) {
                    const index = seriesList.findIndex(s => s.id == editId);
                    if (index > -1) {
                        seriesList[index].name = name;
                        seriesList[index].poster = poster;
                        seriesList[index].status = status;
                        seriesList[index].rating = rating;
                        if(tvmazeId) seriesList[index].tvmazeId = tvmazeId;

                        if (status === 'completed' && seriesList[index].episodes) {
                            seriesList[index].episodes.forEach(ep => {
                                // Sadece çıkmış bölümleri izlendi yap
                                if(!ep.airstamp || new Date(ep.airstamp) <= new Date()) {
                                    ep.watched = true;
                                }
                            });
                        }

                        if (seriesList[index].tvmazeId && (!seriesList[index].episodes || seriesList[index].episodes.length === 0)) {
                            seriesList[index].episodes = await fetchAndStoreEpisodes(seriesList[index].tvmazeId, []);
                        }
                    }
                } else {
                    const newSeries = {
                        id: Date.now(),
                        name: name,
                        poster: poster,
                        status: status,
                        rating: rating,
                        tvmazeId: tvmazeId,
                        dateAdded: Date.now(),
                        episodes: []
                    };

                    if (tvmazeId) {
                        newSeries.episodes = await fetchAndStoreEpisodes(tvmazeId, []);
                    }
                    
                    if (status === 'completed' && newSeries.episodes) {
                        newSeries.episodes.forEach(ep => {
                            if(!ep.airstamp || new Date(ep.airstamp) <= new Date()) {
                                ep.watched = true;
                            }
                        });
                    }

                    seriesList.push(newSeries);
                }

                saveToStorage();
                renderSeries();
                closeModal();
            } catch (error) {
                console.error("Kaydetme hatası:", error);
            } finally {
                saveBtn.innerHTML = originalBtnText;
                saveBtn.disabled = false;
            }
        }

        function editSeries(index) { openModal('edit', index); }

        function deleteSeries(index) {
            seriesList.splice(index, 1);
            saveToStorage();
            renderSeries();
        }

        function openEpisodesModal(seriesIndex) {
            const series = seriesList[seriesIndex];
            const modal = document.getElementById('episodes-modal');
            const content = document.getElementById('episodes-modal-content');
            const container = document.getElementById('seasons-container');

            document.getElementById('ep-modal-title').innerText = series.name;
            if(series.poster) {
                document.getElementById('ep-modal-bg').src = series.poster;
                document.getElementById('ep-modal-poster').src = series.poster;
                document.getElementById('ep-modal-poster-container').classList.remove('hidden');
            } else {
                document.getElementById('ep-modal-bg').src = '';
                document.getElementById('ep-modal-poster-container').classList.add('hidden');
            }

            container.innerHTML = '<div class="flex justify-center py-10"><div class="loader w-8 h-8"></div><span class="ml-3 text-zinc-400">Bölümler yükleniyor...</span></div>';

            modal.classList.remove('hidden');
            modal.classList.add('flex');
            
            setTimeout(async () => {
                modal.classList.remove('opacity-0');
                content.classList.remove('scale-95');
                content.classList.add('scale-100');

                if (!series.episodes || series.episodes.length === 0) {
                    if (series.tvmazeId) {
                        series.episodes = await fetchAndStoreEpisodes(series.tvmazeId, []);
                        saveToStorage();
                    } else {
                        container.innerHTML = '<div class="text-center text-zinc-500 py-10">Bölüm bilgisi bulunamadı. Lütfen diziyi düzenleyip arama listesinden tekrar seçin.</div>';
                        updateModalProgress(seriesIndex);
                        return;
                    }
                }
                renderSeasons(seriesIndex);
            }, 10);
        }

        function closeEpisodesModal() {
            const modal = document.getElementById('episodes-modal');
            const content = document.getElementById('episodes-modal-content');
            
            modal.classList.add('opacity-0');
            content.classList.remove('scale-100');
            content.classList.add('scale-95');
            setTimeout(() => {
                modal.classList.add('hidden');
                modal.classList.remove('flex');
                // Ana ekrandaki değişiklikleri göstermek için kapatınca refresh
                renderSeries();
            }, 300);
        }

        function renderSeasons(seriesIndex) {
            const series = seriesList[seriesIndex];
            const container = document.getElementById('seasons-container');
            
            // Sadece HTML'i baştan çizmeyeceksek, element var mı yok mu kontrolüne göre render yapılabilir.
            // Fakat favori yıldızlarının falan anlık güncellenmesi için şimdilik tamamen yeniden çiziyoruz.
            container.innerHTML = '';
            
            updateModalProgress(seriesIndex);

            if (!series.episodes || series.episodes.length === 0) return;

            const seasons = {};
            series.episodes.forEach(ep => {
                if (!seasons[ep.season]) seasons[ep.season] = [];
                seasons[ep.season].push(ep);
            });

            const now = new Date();

            Object.keys(seasons).forEach(seasonNum => {
                const episodes = seasons[seasonNum];
                
                const availableEps = episodes.filter(ep => !ep.airstamp || new Date(ep.airstamp) <= now).length;
                const watchedEps = episodes.filter(ep => ep.watched).length;
                const isAllWatched = availableEps > 0 && watchedEps === availableEps;

                const seasonDiv = document.createElement('div');
                seasonDiv.className = 'bg-zinc-950/50 border border-zinc-800 rounded-xl overflow-hidden';
                seasonDiv.id = `season-${seasonNum}`;
                
                const selectAllBtnClass = isAllWatched 
                    ? 'border-green-900/50 bg-green-900/20 text-green-500' 
                    : 'border-zinc-600 text-zinc-400 hover:text-white hover:bg-zinc-700';
                const selectAllBtnText = isAllWatched ? '<i class="fa-solid fa-check"></i> İzledim' : 'Tümünü Seç';

                seasonDiv.innerHTML = `
                    <div class="flex items-center justify-between p-4 cursor-pointer hover:bg-zinc-800/50 transition-colors" onclick="toggleSeasonAccordion(this)">
                        <div class="flex items-center gap-3">
                            <i class="fa-solid fa-chevron-right text-zinc-500 transition-transform duration-300 transform rotate-90"></i>
                            <h3 class="font-bold text-white text-lg">Sezon ${seasonNum}</h3>
                            <span class="text-xs bg-zinc-800 text-zinc-400 px-2 py-0.5 rounded-full">${episodes.length} Bölüm</span>
                        </div>
                        
                        <button onclick="event.stopPropagation(); toggleSeasonWatchAll(${seriesIndex}, ${seasonNum})" 
                            class="px-4 py-2 border rounded-lg text-xs font-bold transition-colors z-10 flex items-center gap-1 ${selectAllBtnClass}">
                            ${selectAllBtnText}
                        </button>
                    </div>
                    <!-- Başlangıçta sezonlar açık olarak geliyor, istersen 'hidden' ekleyebilirsin. -->
                    <div class="border-t border-zinc-800 bg-zinc-900/30 p-2 space-y-1 accordion-content">
                        ${episodes.map((ep, idx) => {
                            let isFuture = false;
                            let dateText = "Tarih Bilinmiyor";
                            if (ep.airstamp) {
                                const airDate = new Date(ep.airstamp);
                                isFuture = airDate > now;
                                dateText = airDate.toLocaleDateString('tr-TR', { day: 'numeric', month: 'short', year: 'numeric' });
                            }

                            const disabledAttr = isFuture ? 'disabled' : '';
                            const bgClass = ep.watched ? 'bg-green-900/10 border-green-900/30' : 'bg-transparent border-transparent hover:bg-zinc-800/80 hover:border-zinc-700';
                            const titleClass = ep.watched ? 'text-zinc-500 line-through decoration-green-900/50' : (isFuture ? 'text-zinc-600' : 'text-zinc-200');
                            const numClass = ep.watched ? 'text-zinc-600' : (isFuture ? 'text-zinc-700' : 'text-zinc-400');
                            
                            const heartClass = ep.favorite ? 'fa-solid text-red-500' : 'fa-regular text-zinc-600 hover:text-red-400';
                            const epRating = ep.rating || 0;
                            const starColorClass = epRating > 0 ? 'text-yellow-500' : 'text-zinc-600 group-hover/star:text-yellow-500';

                            return `
                            <div class="flex items-center justify-between p-2 rounded-lg border transition-all group ${bgClass}">
                                <label class="flex items-center gap-4 cursor-pointer flex-1 min-w-0 pr-2">
                                    <input type="checkbox" class="ep-checkbox shrink-0" 
                                        ${ep.watched ? 'checked' : ''} ${disabledAttr}
                                        onchange="toggleEpisode(${seriesIndex}, '${ep.id}', this.checked)">
                                    <div class="flex-1 min-w-0">
                                        <p class="font-medium text-sm md:text-base truncate ${titleClass}">
                                            <span class="mr-2 font-bold ${numClass}">${ep.number}.</span>${ep.name || `Bölüm ${ep.number}`}
                                        </p>
                                        <div class="flex items-center gap-2 mt-1">
                                            <p class="text-xs ${isFuture ? 'text-blue-500/70 font-semibold' : 'text-zinc-500'}"><i class="fa-regular fa-calendar-days mr-1"></i>${dateText} ${isFuture ? '(Gelecek Bölüm)' : ''}</p>
                                        </div>
                                    </div>
                                </label>
                                
                                <div class="flex items-center gap-4 shrink-0 pr-2">
                                    <!-- Bölüm Puanı Slider -->
                                    <div class="relative flex items-center star-rating-container group/star">
                                        <div class="cursor-pointer p-1.5 flex items-center relative">
                                            <i class="fa-star ${starColorClass} text-lg transition-colors"></i>
                                            ${epRating > 0 ? `<span class="absolute -top-2 -right-3 bg-zinc-800 text-xs font-bold text-yellow-500 px-1.5 py-0.5 rounded shadow-lg border border-zinc-700">${epRating}</span>` : ''}
                                        </div>
                                        
                                        <!-- Açılır Slider Büyük Boyut -->
                                        <div class="star-slider-wrapper absolute right-full mr-3 bg-zinc-800 border border-zinc-700 p-3 rounded-lg shadow-2xl hidden items-center gap-3 w-40 z-20">
                                            <span class="text-sm text-yellow-500 font-bold w-8 text-center" id="ep-rating-val-${ep.id}">${epRating}</span>
                                            <input type="range" min="0" max="10" step="0.5" value="${epRating}" 
                                                class="w-full h-1.5 bg-zinc-950 rounded-lg appearance-none cursor-pointer"
                                                oninput="document.getElementById('ep-rating-val-${ep.id}').innerText = this.value"
                                                onchange="rateEpisode(${seriesIndex}, '${ep.id}', this.value); renderSeasons(${seriesIndex})">
                                        </div>
                                    </div>

                                    <!-- Favori Kalp Büyük Boyut -->
                                    <button onclick="toggleFavoriteEp(${seriesIndex}, '${ep.id}')" class="p-1.5 transition-transform hover:scale-125 focus:outline-none">
                                        <i class="${heartClass} fa-heart text-xl"></i>
                                    </button>
                                </div>
                            </div>
                            `;
                        }).join('')}
                    </div>
                `;
                container.appendChild(seasonDiv);
            });
        }

        function toggleSeasonAccordion(headerElement) {
            const content = headerElement.nextElementSibling;
            const icon = headerElement.querySelector('i.fa-chevron-right');
            
            if (content.classList.contains('hidden')) {
                content.classList.remove('hidden');
                icon.style.transform = 'rotate(90deg)';
            } else {
                content.classList.add('hidden');
                icon.style.transform = 'rotate(0deg)';
            }
        }

        function toggleEpisode(seriesIndex, epId, isChecked) {
            const series = seriesList[seriesIndex];
            const ep = series.episodes.find(e => String(e.id) === String(epId));
            if (ep) {
                ep.watched = isChecked;
                saveToStorage();
                updateModalProgress(seriesIndex);
                
                const eventInput = event.target;
                const label = eventInput.closest('label');
                const row = label.parentElement;
                const titleP = label.querySelector('p');
                const numSpan = titleP.querySelector('span');

                if (isChecked) {
                    row.classList.add('bg-green-900/10', 'border-green-900/30');
                    row.classList.remove('bg-transparent', 'border-transparent', 'hover:bg-zinc-800/80', 'hover:border-zinc-700');
                    titleP.classList.add('text-zinc-500', 'line-through', 'decoration-green-900/50');
                    titleP.classList.remove('text-zinc-200');
                    numSpan.classList.add('text-zinc-600');
                    numSpan.classList.remove('text-zinc-400');
                } else {
                    row.classList.remove('bg-green-900/10', 'border-green-900/30');
                    row.classList.add('bg-transparent', 'border-transparent', 'hover:bg-zinc-800/80', 'hover:border-zinc-700');
                    titleP.classList.remove('text-zinc-500', 'line-through', 'decoration-green-900/50');
                    titleP.classList.add('text-zinc-200');
                    numSpan.classList.remove('text-zinc-600');
                    numSpan.classList.add('text-zinc-400');
                }
            }
        }

        function toggleSeasonWatchAll(seriesIndex, seasonNum) {
            const series = seriesList[seriesIndex];
            const seasonEps = series.episodes.filter(ep => String(ep.season) === String(seasonNum));
            
            const now = new Date();
            const availableEps = seasonEps.filter(ep => !ep.airstamp || new Date(ep.airstamp) <= now);
            
            if(availableEps.length === 0) return;

            const isAllWatched = availableEps.every(ep => ep.watched);
            const newState = !isAllWatched; 
            
            availableEps.forEach(ep => { ep.watched = newState; });
            saveToStorage();
            updateModalProgress(seriesIndex);

            const seasonContainer = document.getElementById(`season-${seasonNum}`);
            if (seasonContainer) {
                const checkboxes = seasonContainer.querySelectorAll('input[type="checkbox"]:not(:disabled)');
                checkboxes.forEach(cb => {
                    if (cb.checked !== newState) {
                        cb.checked = newState;
                        
                        const label = cb.closest('label');
                        const row = label.parentElement;
                        const titleP = label.querySelector('p');
                        const numSpan = titleP.querySelector('span');

                        if (newState) {
                            row.classList.add('bg-green-900/10', 'border-green-900/30');
                            row.classList.remove('bg-transparent', 'border-transparent', 'hover:bg-zinc-800/80', 'hover:border-zinc-700');
                            titleP.classList.add('text-zinc-500', 'line-through', 'decoration-green-900/50');
                            titleP.classList.remove('text-zinc-200');
                            numSpan.classList.add('text-zinc-600');
                            numSpan.classList.remove('text-zinc-400');
                        } else {
                            row.classList.remove('bg-green-900/10', 'border-green-900/30');
                            row.classList.add('bg-transparent', 'border-transparent', 'hover:bg-zinc-800/80', 'hover:border-zinc-700');
                            titleP.classList.remove('text-zinc-500', 'line-through', 'decoration-green-900/50');
                            titleP.classList.add('text-zinc-200');
                            numSpan.classList.remove('text-zinc-600');
                            numSpan.classList.add('text-zinc-400');
                        }
                    }
                });

                const btn = seasonContainer.querySelector('button');
                if (newState) {
                    btn.classList.add('border-green-900/50', 'bg-green-900/20', 'text-green-500');
                    btn.classList.remove('border-zinc-600', 'text-zinc-400', 'hover:text-white', 'hover:bg-zinc-700');
                    btn.innerHTML = '<i class="fa-solid fa-check"></i> İzledim';
                } else {
                    btn.classList.remove('border-green-900/50', 'bg-green-900/20', 'text-green-500');
                    btn.classList.add('border-zinc-600', 'text-zinc-400', 'hover:text-white', 'hover:bg-zinc-700');
                    btn.innerHTML = 'Tümünü Seç';
                }
            }
        }

        function toggleFavoriteEp(seriesIndex, epId) {
            const series = seriesList[seriesIndex];
            const ep = series.episodes.find(e => String(e.id) === String(epId));
            if(ep) {
                ep.favorite = !ep.favorite;
                saveToStorage();
                renderSeasons(seriesIndex); 
            }
        }

        function rateEpisode(seriesIndex, epId, ratingVal) {
            const series = seriesList[seriesIndex];
            const ep = series.episodes.find(e => String(e.id) === String(epId));
            if(ep) {
                ep.rating = parseFloat(ratingVal);
                saveToStorage();
            }
        }

        function updateModalProgress(seriesIndex) {
            const series = seriesList[seriesIndex];
            let total = 0;
            let watched = 0;

            if (series.episodes) {
                total = series.episodes.length;
                watched = series.episodes.filter(ep => ep.watched).length;
            }

            const percentage = total > 0 ? (watched / total) * 100 : 0;
            
            document.getElementById('ep-modal-progress-text').innerText = `${watched} / ${total} Bölüm İzlendi`;
            document.getElementById('ep-modal-progress-bar').style.width = `${percentage}%`;
        }

        // Dışarı tıklama eventleri
        document.getElementById('form-modal').addEventListener('click', function(e) {
            if (e.target === this) closeModal();
        });
        document.getElementById('episodes-modal').addEventListener('click', function(e) {
            if (e.target === this) closeEpisodesModal();
        });
        document.addEventListener('click', function(e) {
            if (!e.target.closest('.relative.w-full')) {
                const results = document.getElementById('search-results');
                if(results) results.classList.add('hidden');
            }
        });

    </script>
</body>
</html>
