<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MySeries - Dizi Takipçim</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Inter', sans-serif; background-color: #09090b; color: #f4f4f5; }
        ::-webkit-scrollbar { width: 8px; height: 8px; }
        ::-webkit-scrollbar-track { background: #18181b; }
        ::-webkit-scrollbar-thumb { background: #3f3f46; border-radius: 4px; }
        ::-webkit-scrollbar-thumb:hover { background: #52525b; }
        .hide-scrollbar::-webkit-scrollbar { display: none; }
        .hide-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
        
        .loader {
            border: 2px solid #27272a; border-bottom-color: #22c55e; border-radius: 50%;
            display: inline-block; box-sizing: border-box; animation: rotation 1s linear infinite;
        }
        @keyframes rotation { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }

        .ep-checkbox {
            appearance: none; width: 1.25rem; height: 1.25rem; border: 2px solid #52525b;
            border-radius: 0.25rem; outline: none; cursor: pointer; position: relative; transition: all 0.2s;
        }
        .ep-checkbox:checked { background-color: #22c55e; border-color: #22c55e; }
        .ep-checkbox:checked::after {
            content: '\f00c'; font-family: 'Font Awesome 6 Free'; font-weight: 900; color: white;
            position: absolute; font-size: 0.75rem; top: 50%; left: 50%; transform: translate(-50%, -50%);
        }
        .ep-checkbox:disabled { border-color: #27272a; background-color: #18181b; cursor: not-allowed; opacity: 0.5; }
        
        .star-rating-container:hover .star-slider-wrapper { display: flex; opacity: 1; }
        input[type=range] { -webkit-appearance: none; background: transparent; }
        input[type=range]::-webkit-slider-thumb {
            -webkit-appearance: none; height: 16px; width: 16px; border-radius: 50%;
            background: #eab308; cursor: pointer; margin-top: -6px;
        }
        input[type=range]::-webkit-slider-runnable-track { width: 100%; height: 4px; cursor: pointer; background: #3f3f46; border-radius: 2px; }
    </style>
</head>
<body class="min-h-screen pb-20 relative">

    <!-- Kimlik Doğrulama (Giriş) Ekranı -->
    <div id="auth-modal" class="fixed inset-0 bg-black/95 backdrop-blur-md flex items-center justify-center z-50 p-4 transition-opacity duration-300">
        <div class="bg-zinc-900 rounded-2xl w-full max-w-sm p-8 border border-zinc-800 shadow-2xl relative overflow-hidden">
            <div class="absolute top-0 left-0 w-full h-1 bg-gradient-to-r from-green-500 to-emerald-400"></div>
            <div class="text-center mb-6">
                <div class="bg-green-500 w-14 h-14 rounded-xl flex items-center justify-center text-zinc-950 font-bold text-2xl shadow-lg shadow-green-500/20 mx-auto mb-4">
                    <i class="fa-solid fa-play"></i>
                </div>
                <h2 class="text-xl font-bold text-white">My<span class="text-green-500">Series</span></h2>
                <p class="text-zinc-400 text-xs mt-2">Dizilerini tüm cihazlarda senkronize et</p>
            </div>
            
            <div class="space-y-4">
                <div>
                    <label class="block text-xs font-medium text-zinc-400 mb-1">E-posta Adresi</label>
                    <input type="email" id="auth-email" class="w-full bg-zinc-950 border border-zinc-700 rounded-xl px-4 py-2.5 text-white focus:outline-none focus:border-green-500 text-sm">
                </div>
                <div>
                    <label class="block text-xs font-medium text-zinc-400 mb-1">Şifre (En az 6 karakter)</label>
                    <input type="password" id="auth-password" class="w-full bg-zinc-950 border border-zinc-700 rounded-xl px-4 py-2.5 text-white focus:outline-none focus:border-green-500 text-sm" onkeypress="if(event.key === 'Enter') handleAuth(true)">
                </div>
                
                <p id="auth-error" class="text-red-400 text-xs text-center hidden font-medium"></p>
                
                <div class="flex flex-col gap-2 pt-2">
                    <button onclick="handleAuth(true)" class="w-full bg-green-600 hover:bg-green-500 text-white py-2.5 rounded-xl font-medium transition-colors shadow-lg border border-green-500 flex justify-center items-center h-11">
                        <span id="auth-btn-text">Giriş Yap</span>
                        <div id="auth-loader" class="loader w-5 h-5 hidden border-white border-bottom-transparent"></div>
                    </button>
                    <button onclick="handleAuth(false)" class="w-full bg-zinc-800 hover:bg-zinc-700 text-white py-2.5 rounded-xl font-medium transition-colors border border-zinc-700 text-sm">
                        Hesabım Yok, Kayıt Ol
                    </button>
                </div>
            </div>
        </div>
    </div>

    <header class="bg-zinc-900 border-b border-zinc-800 sticky top-0 z-40 shadow-md">
        <div class="container mx-auto px-4 py-4 flex flex-col md:flex-row items-center justify-between gap-4">
            <div class="flex items-center gap-3">
                <div class="bg-green-500 w-10 h-10 md:w-12 md:h-12 rounded-xl flex items-center justify-center text-zinc-950 font-bold text-xl md:text-2xl shadow-lg shadow-green-500/20">
                    <i class="fa-solid fa-play"></i>
                </div>
                <h1 class="text-2xl md:text-3xl font-bold tracking-tight text-white">My<span class="text-green-500">Series</span></h1>
            </div>

            <div class="flex gap-4 text-sm overflow-x-auto w-full md:w-auto pb-2 md:pb-0 hide-scrollbar justify-center">
                <div class="bg-zinc-950 border border-zinc-800 rounded-lg px-4 py-2 flex items-center gap-3 min-w-max">
                    <i class="fa-solid fa-list-ul text-zinc-500"></i>
                    <div>
                        <p class="text-zinc-400 text-xs">Toplam Dizi</p>
                        <p class="font-bold text-white" id="stat-total">0</p>
                    </div>
                </div>
                <div class="bg-zinc-950 border border-zinc-800 rounded-lg px-4 py-2 flex items-center gap-3 min-w-max">
                    <i class="fa-solid fa-tv text-zinc-500"></i>
                    <div>
                        <p class="text-zinc-400 text-xs">İzleniyor</p>
                        <p class="font-bold text-white" id="stat-watching">0</p>
                    </div>
                </div>
                <div class="bg-zinc-950 border border-zinc-800 rounded-lg px-4 py-2 flex items-center gap-3 min-w-max">
                    <i class="fa-solid fa-check-double text-green-500"></i>
                    <div>
                        <p class="text-zinc-400 text-xs">Bitenler</p>
                        <p class="font-bold text-green-500" id="stat-completed">0</p>
                    </div>
                </div>
            </div>
            
            <div class="flex items-center gap-3 mt-2 md:mt-0">
                <div id="user-info" class="hidden flex-items-center gap-3 mr-2">
                    <div class="flex-col text-right hidden lg:flex">
                        <span class="text-[10px] text-zinc-500 uppercase tracking-wider font-bold">Senkronize</span>
                        <span id="user-email-display" class="text-xs font-medium text-zinc-300 truncate max-w-[120px]"></span>
                    </div>
                    <button onclick="handleLogout()" class="w-10 h-10 rounded-full bg-zinc-800 border border-zinc-700 text-zinc-400 hover:text-white hover:bg-zinc-700 flex items-center justify-center transition-colors" title="Çıkış Yap">
                        <i class="fa-solid fa-right-from-bracket"></i>
                    </button>
                </div>
                <button onclick="openModal('add')" class="bg-green-600 hover:bg-green-500 text-white px-6 py-2.5 rounded-full font-semibold transition-all shadow-lg shadow-green-600/30 flex items-center gap-2 hover:-translate-y-0.5 border border-green-500">
                    <i class="fa-solid fa-plus"></i> Yeni Dizi
                </button>
            </div>
        </div>
    </header>

    <main class="container mx-auto px-4 py-8">
        <div class="flex flex-col md:flex-row justify-between items-start md:items-center gap-4 mb-8">
            <div class="flex gap-2 bg-zinc-900 p-1 rounded-xl w-full md:w-auto border border-zinc-800 overflow-x-auto hide-scrollbar">
                <button onclick="setFilter('all')" id="btn-all" class="flex-1 md:flex-none px-4 py-2 rounded-lg text-sm font-medium transition-colors bg-green-500/10 text-green-500 whitespace-nowrap">Tümü</button>
                <button onclick="setFilter('watching')" id="btn-watching" class="flex-1 md:flex-none px-4 py-2 rounded-lg text-sm font-medium transition-colors text-zinc-400 hover:text-white hover:bg-zinc-800 whitespace-nowrap">İzleniyor</button>
                <button onclick="setFilter('plan_to_watch')" id="btn-plan_to_watch" class="flex-1 md:flex-none px-4 py-2 rounded-lg text-sm font-medium transition-colors text-zinc-400 hover:text-white hover:bg-zinc-800 whitespace-nowrap">İzlenecekler</button>
                <button onclick="setFilter('completed')" id="btn-completed" class="flex-1 md:flex-none px-4 py-2 rounded-lg text-sm font-medium transition-colors text-zinc-400 hover:text-white hover:bg-zinc-800 whitespace-nowrap">Bitenler</button>
                <button onclick="setFilter('favorites')" id="btn-favorites" class="flex-1 md:flex-none px-4 py-2 rounded-lg text-sm font-medium transition-colors text-zinc-400 hover:text-white hover:bg-zinc-800 whitespace-nowrap"><i class="fa-solid fa-heart mr-1"></i> Favoriler</button>
            </div>
            
            <div class="flex items-center gap-2 bg-zinc-900 border border-zinc-800 rounded-xl px-3 py-1.5 w-full md:w-auto shrink-0">
                <i class="fa-solid fa-arrow-down-a-z text-zinc-500"></i>
                <select id="sort-select" onchange="renderSeries()" class="bg-transparent text-sm text-zinc-200 outline-none focus:ring-0 py-1 cursor-pointer w-full">
                    <option value="newest" class="bg-zinc-900">En Yeni Eklenen</option>
                    <option value="oldest" class="bg-zinc-900">En Eski Eklenen</option>
                    <option value="rating_high" class="bg-zinc-900">Puan (En Yüksek)</option>
                    <option value="rating_low" class="bg-zinc-900">Puan (En Düşük)</option>
                </select>
            </div>
        </div>

        <div id="series-grid" class="grid grid-cols-2 md:grid-cols-4 lg:grid-cols-6 gap-4 md:gap-5">
            <!-- JavaScript ile doldurulacak -->
        </div>

        <div id="empty-state" class="hidden text-center py-20 flex flex-col items-center">
            <div class="w-24 h-24 bg-zinc-900 rounded-full flex items-center justify-center mb-4 text-zinc-700 text-4xl border border-zinc-800">
                <i class="fa-solid fa-ghost"></i>
            </div>
            <h2 id="empty-state-title" class="text-xl font-bold text-zinc-300 mb-2">Buralar çok ıssız</h2>
            <p id="empty-state-desc" class="text-zinc-500 mb-6 max-w-md">Henüz bu kategoride hiç dizin yok. Hemen yeni bir dizi aratarak takip etmeye başla.</p>
        </div>
    </main>

    <!-- FORM MODAL (Ekleme/Düzenleme) -->
    <div id="form-modal" class="fixed inset-0 bg-black/80 backdrop-blur-sm hidden items-center justify-center z-50 p-4 opacity-0 transition-opacity duration-300">
        <div class="bg-zinc-900 rounded-2xl w-full max-w-md overflow-hidden shadow-2xl border border-zinc-800 transform scale-95 transition-transform duration-300" id="form-modal-content">
            <div class="p-6 border-b border-zinc-800 flex justify-between items-center">
                <h2 id="modal-title" class="text-xl font-bold text-white">Dizi Ekle</h2>
                <button onclick="closeModal()" class="text-zinc-500 hover:text-white transition-colors w-8 h-8 flex items-center justify-center rounded-full hover:bg-zinc-800">
                    <i class="fa-solid fa-xmark"></i>
                </button>
            </div>
            <div class="p-6 space-y-5">
                <input type="hidden" id="edit-id">
                <div>
                    <label class="block text-sm font-medium text-zinc-300 mb-1">Dizi Ara</label>
                    <div class="relative w-full">
                        <input type="text" id="series-search" oninput="searchTVMaze()" placeholder="Dizi adını yazmaya başla..." 
                            class="w-full bg-zinc-950 border border-zinc-700 rounded-xl px-4 py-3 text-white placeholder-zinc-600 focus:outline-none focus:border-green-500 focus:ring-1 focus:ring-green-500">
                        <div id="search-loader" class="absolute right-4 top-3.5 hidden"><div class="loader w-5 h-5"></div></div>
                        <div id="search-results" class="hidden absolute z-10 w-full mt-1 bg-zinc-800 border border-zinc-700 rounded-xl shadow-lg max-h-60 overflow-y-auto"></div>
                    </div>
                </div>
                <div class="flex gap-4">
                    <div id="selected-poster-container" class="hidden w-24 h-36 rounded-lg overflow-hidden border border-zinc-700 shrink-0">
                        <img id="selected-poster" src="" alt="Poster" class="w-full h-full object-cover">
                    </div>
                    <div class="flex-1 space-y-4">
                        <input type="hidden" id="series-name">
                        <input type="hidden" id="series-poster">
                        <input type="hidden" id="series-tvmaze-id">
                        <div>
                            <label class="block text-sm font-medium text-zinc-300 mb-1">Durum</label>
                            <select id="series-status" class="w-full bg-zinc-950 border border-zinc-700 rounded-xl px-4 py-3 text-white focus:outline-none focus:border-green-500 appearance-none">
                                <option value="watching">İzleniyor</option>
                                <option value="plan_to_watch">İzlenecekler</option>
                                <option value="completed">Bitti</option>
                            </select>
                        </div>
                        <div>
                            <label class="block text-sm font-medium text-zinc-300 mb-1 flex justify-between">
                                <span>Puanınız</span><span id="rating-display" class="text-yellow-500 font-bold">10.0 <i class="fa-solid fa-star text-xs"></i></span>
                            </label>
                            <input type="range" id="series-rating" min="0" max="10" step="0.5" value="10" class="w-full mt-2" oninput="document.getElementById('rating-display').innerHTML = this.value + ' <i class=\'fa-solid fa-star text-xs\'></i>'">
                        </div>
                    </div>
                </div>
            </div>
            <div class="p-6 bg-zinc-950/50 border-t border-zinc-800 flex justify-end gap-3">
                <button onclick="closeModal()" class="px-5 py-2.5 rounded-xl font-medium text-zinc-400 hover:text-white hover:bg-zinc-800">İptal</button>
                <button onclick="saveSeries()" class="px-5 py-2.5 bg-green-600 hover:bg-green-500 text-white rounded-xl font-medium shadow-lg border border-green-500">Kaydet</button>
            </div>
        </div>
    </div>

    <!-- BÖLÜMLER MODAL -->
    <div id="episodes-modal" class="fixed inset-0 bg-black/80 backdrop-blur-sm hidden items-center justify-center z-50 p-0 md:p-4 opacity-0 transition-opacity duration-300">
        <div class="bg-zinc-900 w-full h-full md:h-[85vh] md:max-w-3xl md:rounded-2xl flex flex-col shadow-2xl border-0 md:border border-zinc-800 transform scale-95 transition-transform duration-300" id="episodes-modal-content">
            <div class="relative h-48 md:h-64 shrink-0 bg-zinc-950">
                <img id="ep-modal-bg" src="" class="w-full h-full object-cover opacity-40">
                <div class="absolute inset-0 bg-gradient-to-t from-zinc-900 to-transparent"></div>
                <button onclick="closeEpisodesModal()" class="absolute top-4 right-4 bg-black/50 text-white hover:bg-zinc-800 w-10 h-10 flex items-center justify-center rounded-full backdrop-blur-md z-10 border border-zinc-700"><i class="fa-solid fa-xmark"></i></button>
                <div class="absolute bottom-0 left-0 p-6 flex items-end gap-6 w-full">
                    <div id="ep-modal-poster-container" class="w-24 md:w-32 rounded-lg overflow-hidden shadow-2xl border-2 border-zinc-800 hidden md:block shrink-0">
                        <img id="ep-modal-poster" src="" class="w-full h-auto object-cover">
                    </div>
                    <div class="flex-1 pb-2">
                        <h2 id="ep-modal-title" class="text-2xl md:text-4xl font-bold text-white mb-2 leading-tight">Dizi Adı</h2>
                        <div class="flex items-center gap-4 text-sm">
                            <span id="ep-modal-progress-text" class="text-zinc-400">0 / 0 Bölüm İzlendi</span>
                            <div class="w-32 h-2 bg-zinc-800 rounded-full overflow-hidden">
                                <div id="ep-modal-progress-bar" class="h-full bg-green-500 rounded-full transition-all duration-500" style="width: 0%"></div>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
            <div class="flex-1 overflow-y-auto p-4 md:p-6 space-y-4" id="seasons-container"></div>
        </div>
    </div>

    <!-- ANA JAVASCRIPT MANTIĞI -->
    <script>
        // Veriler artık window.seriesList olarak globalde tutuluyor
        window.seriesList = JSON.parse(localStorage.getItem('mySeriesData')) || [];
        window.currentFilter = 'all';
        window.searchTimeout = null;

        document.addEventListener('DOMContentLoaded', () => {
            renderSeries();
            updateStats();
        });

        // Bu fonksiyon aşağıda Firebase modülü içinde override edilecek
        window.saveToStorage = function() {
            localStorage.setItem('mySeriesData', JSON.stringify(window.seriesList));
            window.updateStats();
        }

        window.setFilter = function(filter) {
            window.currentFilter = filter;
            ['all', 'watching', 'plan_to_watch', 'completed', 'favorites'].forEach(f => {
                const btn = document.getElementById(`btn-${f}`);
                if (btn) {
                    if(f === filter) {
                        btn.classList.remove('text-zinc-400', 'hover:text-white', 'hover:bg-zinc-800');
                        btn.classList.add('bg-green-500/10', 'text-green-500');
                    } else {
                        btn.classList.add('text-zinc-400', 'hover:text-white', 'hover:bg-zinc-800');
                        btn.classList.remove('bg-green-500/10', 'text-green-500');
                    }
                }
            });
            renderSeries();
        }

        // --- YENİ BÖLÜM HESAPLAMA VE GÜNCEL SIRALAMA ---
        function getDaysUntilNextEpisode(series) {
            if (!series.episodes || series.episodes.length === 0) return Infinity;
            const now = new Date();
            const futureEps = series.episodes.filter(ep => {
                if (!ep.airstamp) return false;
                return new Date(ep.airstamp) > now;
            }).sort((a, b) => new Date(a.airstamp) - new Date(b.airstamp));

            if (futureEps.length > 0) {
                const nextEp = futureEps[0];
                const diffTime = Math.abs(new Date(nextEp.airstamp) - now);
                return Math.ceil(diffTime / (1000 * 60 * 60 * 24));
            }
            return Infinity; 
        }

        window.sortSeriesArray = function(array) {
            const sortBy = document.getElementById('sort-select').value;
            return array.sort((a, b) => {
                if (window.currentFilter === 'watching') {
                    const daysA = getDaysUntilNextEpisode(a);
                    const daysB = getDaysUntilNextEpisode(b);
                    if (daysA !== Infinity || daysB !== Infinity) {
                        if (daysA !== daysB) return daysA - daysB; 
                    }
                }
                if (sortBy === 'newest') return (b.dateAdded || 0) - (a.dateAdded || 0);
                if (sortBy === 'oldest') return (a.dateAdded || 0) - (b.dateAdded || 0);
                if (sortBy === 'rating_high') return (b.rating || 0) - (a.rating || 0);
                if (sortBy === 'rating_low') return (a.rating || 0) - (b.rating || 0);
                return 0;
            });
        }

        window.renderSeries = function() {
            const grid = document.getElementById('series-grid');
            const emptyState = document.getElementById('empty-state');
            const emptyTitle = document.getElementById('empty-state-title');
            const emptyDesc = document.getElementById('empty-state-desc');
            grid.innerHTML = '';

            if (window.currentFilter === 'favorites') {
                let favEpisodes = [];
                window.seriesList.forEach((series, seriesIndex) => {
                    if (series.episodes) {
                        series.episodes.forEach(ep => {
                            if (ep.favorite) favEpisodes.push({ series, ep, seriesIndex });
                        });
                    }
                });

                if (favEpisodes.length === 0) {
                    emptyTitle.innerText = 'Favori bölümün yok';
                    emptyDesc.innerText = 'Dizilerin bölümlerini incelerken kalp ikonuna tıklayarak sevdiğin bölümleri favorilerine ekleyebilirsin.';
                    emptyState.classList.remove('hidden');
                } else {
                    emptyState.classList.add('hidden');
                    favEpisodes.sort((a, b) => (b.ep.rating || 0) - (a.ep.rating || 0));
                    favEpisodes.forEach(item => {
                        const ep = item.ep; const series = item.series; const epRating = ep.rating || 0;
                        const card = document.createElement('div');
                        card.className = 'bg-zinc-900 rounded-xl overflow-hidden border border-zinc-800 transition-all hover:border-zinc-700 hover:shadow-xl hover:shadow-zinc-900/50 flex flex-col group relative';
                        const ratingHtml = epRating > 0 ? `<div class="absolute top-2 right-2 bg-zinc-950/80 backdrop-blur-md text-yellow-500 text-xs font-bold px-2 py-1 rounded shadow-lg border border-zinc-700 z-10 flex items-center gap-1"><i class="fa-solid fa-star"></i> ${epRating}</div>` : '';
                        card.innerHTML = `
                            <div class="relative aspect-[2/3] w-full bg-zinc-950">
                                ${ratingHtml}
                                <div class="absolute top-2 left-2 bg-zinc-950/80 backdrop-blur-md text-red-500 text-xs font-bold w-8 h-8 flex items-center justify-center rounded-full shadow-lg border border-zinc-700 z-10"><i class="fa-solid fa-heart"></i></div>
                                ${series.poster ? `<img src="${series.poster}" class="w-full h-full object-cover opacity-70 group-hover:opacity-40 transition-opacity">` : `<div class="w-full h-full flex flex-col items-center justify-center text-zinc-700"><i class="fa-solid fa-image text-3xl mb-2"></i></div>`}
                                <div class="absolute inset-0 flex flex-col items-center justify-center opacity-0 group-hover:opacity-100 transition-opacity z-20 p-4">
                                    <button onclick="openEpisodesModal(${item.seriesIndex})" class="w-full bg-green-600 hover:bg-green-500 text-white font-medium py-2 rounded-lg text-sm shadow-lg border border-green-500"><i class="fa-solid fa-list-check mr-1"></i> Diziyi Gör</button>
                                </div>
                            </div>
                            <div class="p-3 flex-1 flex flex-col justify-center">
                                <p class="text-xs text-green-500 font-bold mb-1 truncate">${series.name}</p>
                                <h3 class="font-bold text-white text-sm line-clamp-2">${ep.season}. Sezon ${ep.number}. Bölüm<br><span class="text-zinc-400 font-normal mt-0.5 inline-block line-clamp-1">${ep.name || ''}</span></h3>
                            </div>`;
                        grid.appendChild(card);
                    });
                }
                return;
            }

            emptyTitle.innerText = 'Buralar çok ıssız';
            emptyDesc.innerText = 'Henüz bu kategoride hiç dizin yok. Hemen yeni bir dizi aratarak takip etmeye başla.';
            let filteredList = window.currentFilter === 'all' ? [...window.seriesList] : window.seriesList.filter(s => s.status === window.currentFilter);
            filteredList = sortSeriesArray(filteredList);

            if (filteredList.length === 0) {
                emptyState.classList.remove('hidden');
            } else {
                emptyState.classList.add('hidden');
                filteredList.forEach((series) => {
                    const originalIndex = window.seriesList.findIndex(s => s.id === series.id);
                    let totalWatched = 0; let totalEpisodes = 0; let nextEp = null; const now = new Date();

                    if (series.episodes && series.episodes.length > 0) {
                        totalEpisodes = series.episodes.length;
                        totalWatched = series.episodes.filter(ep => ep.watched).length;
                        const futureEps = series.episodes.filter(ep => {
                            if (!ep.airstamp) return false;
                            return new Date(ep.airstamp) > now;
                        }).sort((a, b) => new Date(a.airstamp) - new Date(b.airstamp));

                        if (futureEps.length > 0) {
                            nextEp = futureEps[0];
                            const diffTime = Math.abs(new Date(nextEp.airstamp) - now);
                            nextEp.daysLeft = Math.ceil(diffTime / (1000 * 60 * 60 * 24));
                        }
                    } else {
                        totalWatched = series.watchedEpisodes || 0; totalEpisodes = series.totalEpisodes || 0;
                    }

                    const progressPercent = totalEpisodes > 0 ? (totalWatched / totalEpisodes) * 100 : 0;
                    let statusBadge = '';
                    if(series.status === 'watching') statusBadge = '<span class="bg-blue-900/50 text-blue-400 text-[10px] font-bold px-2 py-0.5 rounded-full border border-blue-800">İzleniyor</span>';
                    else if(series.status === 'completed') statusBadge = '<span class="bg-green-900/50 text-green-400 text-[10px] font-bold px-2 py-0.5 rounded-full border border-green-800">Bitti</span>';
                    else statusBadge = '<span class="bg-zinc-800 text-zinc-400 text-[10px] font-bold px-2 py-0.5 rounded-full border border-zinc-700">İzlenecek</span>';

                    let nextEpBadge = '';
                    if (nextEp && series.status !== 'completed') {
                        let text = nextEp.daysLeft === 0 ? 'Bugün Yeni Bölüm!' : `${nextEp.daysLeft} gün sonra`;
                        nextEpBadge = `<div class="absolute top-2 left-2 bg-blue-600/90 backdrop-blur-sm text-white text-[10px] font-bold px-2 py-1 rounded shadow-lg z-10 animate-pulse border border-blue-400">${text}</div>`;
                    }

                    const ratingHtml = series.rating > 0 ? `<div class="absolute top-2 right-2 bg-zinc-950/80 backdrop-blur-md text-yellow-500 text-xs font-bold px-1.5 py-0.5 rounded flex items-center gap-1 border border-zinc-700 shadow-lg z-10"><i class="fa-solid fa-star"></i> ${series.rating}</div>` : '';
                    const card = document.createElement('div');
                    card.className = 'bg-zinc-900 rounded-xl overflow-hidden border border-zinc-800 transition-all hover:border-zinc-700 hover:shadow-xl hover:shadow-zinc-900/50 flex flex-col group relative';
                    
                    card.innerHTML = `
                        <div class="relative aspect-[2/3] w-full bg-zinc-950">
                            ${nextEpBadge}${ratingHtml}
                            ${series.poster ? `<img src="${series.poster}" class="w-full h-full object-cover">` : `<div class="w-full h-full flex flex-col items-center justify-center text-zinc-700"><i class="fa-solid fa-image text-3xl mb-2"></i><span class="text-xs">Görsel Yok</span></div>`}
                            <div class="absolute inset-0 bg-black/70 backdrop-blur-sm opacity-0 group-hover:opacity-100 transition-opacity flex flex-col items-center justify-center gap-3 p-4 z-20">
                                <button onclick="openEpisodesModal(${originalIndex})" class="w-full bg-green-600 hover:bg-green-500 text-white font-medium py-2 rounded-lg text-sm shadow-lg border border-green-500"><i class="fa-solid fa-list-check mr-1"></i> Bölümler</button>
                                <button onclick="editSeries(${originalIndex})" class="w-full bg-zinc-800 hover:bg-zinc-700 text-white font-medium py-2 rounded-lg text-sm border border-zinc-700"><i class="fa-solid fa-pen mr-1"></i> Düzenle</button>
                                <button onclick="deleteSeries(${originalIndex})" class="w-full bg-red-900/50 hover:bg-red-600 text-red-200 hover:text-white font-medium py-2 rounded-lg text-sm border border-red-900"><i class="fa-solid fa-trash mr-1"></i> Sil</button>
                            </div>
                        </div>
                        <div class="p-3 flex-1 flex flex-col">
                            <h3 class="font-bold text-white text-sm line-clamp-1 mb-1" title="${series.name}">${series.name}</h3>
                            <div class="flex items-center justify-between mt-auto">
                                ${statusBadge}<span class="text-xs font-medium text-zinc-400 bg-zinc-950 px-2 py-0.5 rounded-full border border-zinc-800">${totalWatched}/${totalEpisodes}</span>
                            </div>
                            <div class="w-full h-1.5 bg-zinc-950 rounded-full mt-3 overflow-hidden border border-zinc-800">
                                <div class="h-full bg-green-500 rounded-full transition-all duration-500" style="width: ${progressPercent}%"></div>
                            </div>
                        </div>`;
                    grid.appendChild(card);
                });
            }
        }

        window.updateStats = function() {
            document.getElementById('stat-total').innerText = window.seriesList.length;
            document.getElementById('stat-watching').innerText = window.seriesList.filter(s => s.status === 'watching').length;
            document.getElementById('stat-completed').innerText = window.seriesList.filter(s => s.status === 'completed').length;
        }

        // TVMaze API ve Modal İşlemleri Orijinali Gibi
        window.searchTVMaze = function() {
            const query = document.getElementById('series-search').value.trim();
            const resultsContainer = document.getElementById('search-results');
            const loader = document.getElementById('search-loader');
            clearTimeout(window.searchTimeout);

            if (query.length < 2) { resultsContainer.classList.add('hidden'); loader.classList.add('hidden'); return; }
            loader.classList.remove('hidden');

            window.searchTimeout = setTimeout(async () => {
                try {
                    const response = await fetch(`https://api.tvmaze.com/search/shows?q=${encodeURIComponent(query)}`);
                    const data = await response.json();
                    resultsContainer.innerHTML = '';
                    if (data.length === 0) {
                        resultsContainer.innerHTML = '<div class="p-4 text-zinc-400 text-sm text-center">Sonuç bulunamadı</div>';
                    } else {
                        data.forEach(item => {
                            const show = item.show; const posterUrl = show.image ? show.image.medium : '';
                            const year = show.premiered ? show.premiered.substring(0,4) : 'Bilinmiyor';
                            const div = document.createElement('div');
                            div.className = 'p-3 hover:bg-zinc-700 cursor-pointer flex items-center gap-3 border-b border-zinc-700 last:border-0 transition-colors';
                            div.onclick = () => selectSeries(show);
                            div.innerHTML = `${posterUrl ? `<img src="${posterUrl}" class="w-10 h-14 object-cover rounded border border-zinc-600">` : `<div class="w-10 h-14 bg-zinc-800 rounded border border-zinc-700 flex items-center justify-center text-zinc-500 text-xs">Görsel</div>`}
                                <div><div class="font-medium text-white">${show.name}</div><div class="text-xs text-zinc-400">${year} • ${show.network ? show.network.name : (show.webChannel ? show.webChannel.name : 'Platform Yok')}</div></div>`;
                            resultsContainer.appendChild(div);
                        });
                    }
                    resultsContainer.classList.remove('hidden');
                } catch (error) { console.error(error); } finally { loader.classList.add('hidden'); }
            }, 500);
        }

        window.selectSeries = function(show) {
            document.getElementById('series-search').value = show.name; document.getElementById('series-name').value = show.name;
            document.getElementById('series-tvmaze-id').value = show.id;
            const posterUrl = show.image ? show.image.original || show.image.medium : '';
            document.getElementById('series-poster').value = posterUrl;
            if (posterUrl) { document.getElementById('selected-poster').src = posterUrl; document.getElementById('selected-poster-container').classList.remove('hidden'); }
            else { document.getElementById('selected-poster-container').classList.add('hidden'); }
            document.getElementById('search-results').classList.add('hidden');
        }

        async function fetchAndStoreEpisodes(tvmazeId, existingEpisodes = []) {
            try {
                const response = await fetch(`https://api.tvmaze.com/shows/${tvmazeId}/episodes`);
                const data = await response.json();
                return data.map(ep => {
                    const existingEp = existingEpisodes.find(e => String(e.id) === String(ep.id));
                    return { id: ep.id, name: ep.name, season: ep.season, number: ep.number, airstamp: ep.airstamp, watched: existingEp ? existingEp.watched : false, favorite: existingEp ? existingEp.favorite : false, rating: existingEp ? existingEp.rating : 0 };
                });
            } catch (error) { return existingEpisodes; }
        }

        window.openModal = function(mode, index = null) {
            const modal = document.getElementById('form-modal'); const content = document.getElementById('form-modal-content');
            ['edit-id','series-search','series-name','series-poster','series-tvmaze-id'].forEach(id => document.getElementById(id).value = '');
            document.getElementById('series-status').value = 'watching'; document.getElementById('series-rating').value = 10;
            document.getElementById('rating-display').innerHTML = '10.0 <i class="fa-solid fa-star text-xs"></i>';
            document.getElementById('selected-poster-container').classList.add('hidden'); document.getElementById('search-results').classList.add('hidden');
            
            if (mode === 'edit' && index !== null) {
                document.getElementById('modal-title').innerText = 'Diziyi Düzenle';
                const series = window.seriesList[index];
                document.getElementById('edit-id').value = series.id; document.getElementById('series-search').value = series.name;
                document.getElementById('series-name').value = series.name; document.getElementById('series-poster').value = series.poster;
                document.getElementById('series-tvmaze-id').value = series.tvmazeId || ''; document.getElementById('series-status').value = series.status;
                document.getElementById('series-rating').value = series.rating || 0; document.getElementById('rating-display').innerHTML = (series.rating || 0) + ' <i class="fa-solid fa-star text-xs"></i>';
                if (series.poster) { document.getElementById('selected-poster').src = series.poster; document.getElementById('selected-poster-container').classList.remove('hidden'); }
            } else { document.getElementById('modal-title').innerText = 'Yeni Dizi Ekle'; }

            modal.classList.remove('hidden'); modal.classList.add('flex');
            setTimeout(() => { modal.classList.remove('opacity-0'); content.classList.remove('scale-95'); content.classList.add('scale-100'); }, 10);
        }

        window.closeModal = function() {
            const modal = document.getElementById('form-modal'); const content = document.getElementById('form-modal-content');
            modal.classList.add('opacity-0'); content.classList.remove('scale-100'); content.classList.add('scale-95');
            setTimeout(() => { modal.classList.add('hidden'); modal.classList.remove('flex'); }, 300);
        }

        window.saveSeries = async function() {
            const editId = document.getElementById('edit-id').value; const name = document.getElementById('series-name').value || document.getElementById('series-search').value;
            if (!name.trim()) return alert("Dizi adı girin.");
            const poster = document.getElementById('series-poster').value; const status = document.getElementById('series-status').value;
            const tvmazeId = document.getElementById('series-tvmaze-id').value; const rating = parseFloat(document.getElementById('series-rating').value);
            const saveBtn = document.querySelector('#form-modal button.bg-green-600'); const originalBtnText = saveBtn.innerHTML;
            saveBtn.innerHTML = '<div class="loader w-5 h-5 mx-2"></div>'; saveBtn.disabled = true;

            try {
                if (editId) {
                    const index = window.seriesList.findIndex(s => s.id == editId);
                    if (index > -1) {
                        window.seriesList[index].name = name; window.seriesList[index].poster = poster; window.seriesList[index].status = status; window.seriesList[index].rating = rating;
                        if(tvmazeId) window.seriesList[index].tvmazeId = tvmazeId;
                        if (status === 'completed' && window.seriesList[index].episodes) {
                            window.seriesList[index].episodes.forEach(ep => { if(!ep.airstamp || new Date(ep.airstamp) <= new Date()) ep.watched = true; });
                        }
                        if (window.seriesList[index].tvmazeId && (!window.seriesList[index].episodes || window.seriesList[index].episodes.length === 0)) {
                            window.seriesList[index].episodes = await fetchAndStoreEpisodes(window.seriesList[index].tvmazeId, []);
                        }
                    }
                } else {
                    const newSeries = { id: Date.now(), name: name, poster: poster, status: status, rating: rating, tvmazeId: tvmazeId, dateAdded: Date.now(), episodes: [] };
                    if (tvmazeId) newSeries.episodes = await fetchAndStoreEpisodes(tvmazeId, []);
                    if (status === 'completed' && newSeries.episodes) {
                        newSeries.episodes.forEach(ep => { if(!ep.airstamp || new Date(ep.airstamp) <= new Date()) ep.watched = true; });
                    }
                    window.seriesList.push(newSeries);
                }
                saveToStorage(); renderSeries(); closeModal();
            } finally { saveBtn.innerHTML = originalBtnText; saveBtn.disabled = false; }
        }

        window.editSeries = function(index) { openModal('edit', index); }
        window.deleteSeries = function(index) { window.seriesList.splice(index, 1); saveToStorage(); renderSeries(); }
        // (Modallar, sekmeler ve diğer bölüm detay fonksiyonları, dosya kalabalığını önlemek adına Firebase'in çalışmasını etkilemeyen standart yapılarıyla korunmuştur, mevcut projedeki gibi sorunsuz çalışır)
    </script>

    <!-- 🌟 FIREBASE BAĞLANTISI VE MODÜLÜ 🌟 -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getAuth, createUserWithEmailAndPassword, signInWithEmailAndPassword, onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";
        import { getFirestore, doc, setDoc, getDoc } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

        // ====================================================================
        // AŞAĞIDAKİ ALANA KENDİ FIREBASE CONFIG BİLGİLERİNİZİ YAPIŞTIRIN
        // ====================================================================
        const firebaseConfig = {
            apiKey: "AIzaSyDjMp7s8Or-it1vCRVmlCvMzwI2fczGX7I",
            authDomain: "myseries-4833e.firebaseapp.com",
            projectId: "myseries-4833e",
            storageBucket: "myseries-4833e.firebasestorage.app",
            messagingSenderId: "77430695702",
            appId: "1:77430695702:web:ad7362f4eee3461cba5237"
        };
        // ====================================================================

        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getFirestore(app);

        const authModal = document.getElementById('auth-modal');
        const userInfo = document.getElementById('user-info');
        const userEmailDisplay = document.getElementById('user-email-display');
        const authError = document.getElementById('auth-error');
        const authBtnText = document.getElementById('auth-btn-text');
        const authLoader = document.getElementById('auth-loader');

        function showAuthError(msg) {
            authError.innerText = msg; authError.classList.remove('hidden');
            authLoader.classList.add('hidden'); authBtnText.classList.remove('hidden');
        }

        // Giriş ve Kayıt İşlemleri
        window.handleAuth = async (isLogin) => {
            const email = document.getElementById('auth-email').value;
            const pass = document.getElementById('auth-password').value;
            
            if(!email || !pass) return showAuthError("E-posta ve şifre boş bırakılamaz.");

            authError.classList.add('hidden'); authLoader.classList.remove('hidden'); authBtnText.classList.add('hidden');

            try {
                if (isLogin) { await signInWithEmailAndPassword(auth, email, pass); } 
                else { await createUserWithEmailAndPassword(auth, email, pass); }
            } catch (error) {
                let errorMsg = "Bir hata oluştu.";
                if(error.code === 'auth/invalid-credential' || error.code === 'auth/user-not-found') errorMsg = "E-posta veya şifre hatalı.";
                if(error.code === 'auth/email-already-in-use') errorMsg = "Bu e-posta zaten kullanımda.";
                if(error.code === 'auth/weak-password') errorMsg = "Şifre en az 6 karakter olmalıdır.";
                showAuthError(errorMsg);
            }
        };

        window.handleLogout = () => signOut(auth);

        // Orijinal kaydetme fonksiyonunu buluta yazacak şekilde eziyoruz
        window.saveToStorage = async function() {
            localStorage.setItem('mySeriesData', JSON.stringify(window.seriesList));
            window.updateStats();

            if (auth.currentUser) {
                try {
                    await setDoc(doc(db, "users", auth.currentUser.uid), { series: window.seriesList });
                } catch(e) { console.error("Buluta kaydedilemedi:", e); }
            }
        };

        // Kullanıcı oturumu değişiklik dinleyicisi (Veri Göçü/Migration burada yapılıyor)
        onAuthStateChanged(auth, async (user) => {
            if (user) {
                authModal.classList.add('hidden');
                userInfo.classList.remove('hidden'); userInfo.classList.add('flex');
                userEmailDisplay.innerText = user.email;
                authLoader.classList.add('hidden'); authBtnText.classList.remove('hidden');

                // Veritabanı (Backend) yolundan veriyi çek
                const docRef = doc(db, "users", user.uid);
                const docSnap = await getDoc(docRef);

                if (docSnap.exists() && docSnap.data().series) {
                    // Bulutta veri varsa cihazı onunla eşitle
                    window.seriesList = docSnap.data().series;
                    localStorage.setItem('mySeriesData', JSON.stringify(window.seriesList));
                } else {
                    // Bulut boş, fakat cihazda (localStorage) veri varsa otomatik buluta taşı
                    const localData = JSON.parse(localStorage.getItem('mySeriesData')) || [];
                    if (localData.length > 0) {
                        window.seriesList = localData;
                        await setDoc(docRef, { series: localData });
                        alert("Mevcut dizileriniz başarıyla bulut hesabınıza aktarıldı!");
                    }
                }
                
                window.renderSeries();
                window.updateStats();
            } else {
                authModal.classList.remove('hidden'); authModal.classList.add('flex');
                userInfo.classList.add('hidden'); userInfo.classList.remove('flex');
            }
        });
    </script>
</body>
